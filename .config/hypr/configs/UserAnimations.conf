animations {
    enabled = true

    # Bezier curves mượt, có độ nảy cực nhẹ ở cuối hành trình
    bezier = glassEase, 0.16, 1, 0.3, 1
    bezier = glassPop, 0.12, 0.95, 0.25, 1.02
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 5, glassPop, popin 88%
    animation = windowsOut, 1, 4, glassEase, popin 90%
    animation = windowsMove, 1, 5, glassEase
    animation = fade, 1, 5, glassEase
    animation = workspaces, 1, 6, glassEase, slidefade 15%
    animation = specialWorkspace, 1, 5, glassEase, slidefadevert 15%
    animation = layers, 1, 4, glassEase, fade
}
