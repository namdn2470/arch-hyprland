animations {
    enabled = true

    # Bộ đường cong vật lý siêu mượt (iOS / macOS fluid curves)
    # Bắt đầu nhanh, giảm tốc dài và êm ở cuối hành trình
    bezier = fluidOut, 0.16, 1, 0.3, 1
    bezier = ultraSmooth, 0.22, 1, 0.36, 1
    # Độ nảy cực nhẹ tạo cảm giác có trọng lượng khi cửa sổ mở ra
    bezier = softSpring, 0.18, 1.08, 0.32, 1
    # Đường cong cho di chuyển / tự động chia lại bố cục (tiling)
    bezier = layoutGlide, 0.25, 1, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    # Hiệu ứng CỬA SỔ (tách riêng mở, đóng, di chuyển)
    animation = windowsIn, 1, 4.5, softSpring, popin 88%
    animation = windowsOut, 1, 3.5, ultraSmooth, popin 92%
    animation = windowsMove, 1, 4.5, layoutGlide, slide

    # Hiệu ứng ĐỔI FOCUS (viền, độ mờ kính, bóng đổ, dim nền)
    animation = border, 1, 6, ultraSmooth
    # Bỏ comment dòng dưới nếu muốn viền gradient xoay liên tục (tốn pin hơn trên laptop)
    # animation = borderangle, 1, 40, linear, loop
    animation = fadeIn, 1, 3.5, ultraSmooth
    animation = fadeOut, 1, 3, ultraSmooth
    animation = fadeSwitch, 1, 4, ultraSmooth
    animation = fadeShadow, 1, 4, ultraSmooth
    animation = fadeDim, 1, 4, ultraSmooth

    # Hiệu ứng CHUYỂN WORKSPACE
    animation = workspaces, 1, 4.8, fluidOut, slidefade 10%
    animation = specialWorkspace, 1, 4.5, fluidOut, slidefadevert 12%

    # Layers (Rofi, SwayNC, Wlogout, menu chuột phải)
    animation = layersIn, 1, 3.8, softSpring, popin 94%
    animation = layersOut, 1, 3, ultraSmooth, fade
}
