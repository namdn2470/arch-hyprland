general {
    gaps_in = 6
    gaps_out = 12

    border_size = 1

    # Viền kính bắt sáng đồng bộ màu nhấn từ Matugen (colors.conf)
    col.active_border = $primary $tertiary rgba(ffffff35) 45deg
    col.inactive_border = rgba(ffffff14)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Bo góc nhẹ tinh tế chuẩn Glass
    rounding = 10

    # Độ trong suốt cho cửa sổ active và inactive
    active_opacity = 0.85
    inactive_opacity = 0.76
    fullscreen_opacity = 1.0

    # Làm tối nhẹ cửa sổ nền giúp chuyển focus có chiều sâu 3D
    dim_inactive = true
    dim_strength = 0.10
    dim_special = 0.35

    # Viền kính mỏng phản chiếu nhẹ
    border_part_of_window = true

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000077)
        color_inactive = rgba(00000044)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 11           # Tăng nhẹ độ nhòe để bù cho passes = 3
        passes = 3          # 3 passes giữ độ mịn kính mờ, tối ưu FPS ~25% khi chạy animation
        new_optimizations = true
        xray = false        # Các cửa sổ xếp chồng lên nhau vẫn làm mờ lớp dưới
        ignore_opacity = true # Blur hoạt động trên mọi app có độ mờ
        noise = 0.015       # Thêm vân nhiễu siêu mịn tạo cảm giác kính nhám
        contrast = 1.05
        brightness = 0.85
        vibrancy = 0.22     # Đẩy nhẹ độ rực màu của hình nền xuyên qua kính
        vibrancy_darkness = 0.5
        popups = true       # Làm mờ cả menu chuột phải và popup
    }
}
