general {
    gaps_in = 6
    gaps_out = 12

    border_size = 1

    # Viền gradient bán trong suốt tạo hiệu ứng cạnh kính bắt sáng
    col.active_border = rgba(ffffff45) rgba(ffffff15) 45deg
    col.inactive_border = rgba(ffffff12)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Bo góc nhẹ tinh tế chuẩn Glass
    rounding = 10

    # Độ trong suốt cho cửa sổ active và inactive
    active_opacity = 0.82
    inactive_opacity = 0.72
    fullscreen_opacity = 0.95

    # Viền kính mỏng phản chiếu nhẹ
    border_part_of_window = true

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10           # Tăng độ nhòe để mịn hơn
        passes = 4          # 4 passes giúp kính sâu và không bị rỗ hạt
        new_optimizations = true
        xray = false        # Các cửa sổ xếp chồng lên nhau vẫn làm mờ lớp dưới
        ignore_opacity = true # Blur hoạt động trên mọi app có độ mờ
        noise = 0.018       # Thêm vân nhiễu siêu mịn tạo cảm giác kính nhám
        contrast = 1.05
        brightness = 0.85
        vibrancy = 0.22     # Đẩy nhẹ độ rực màu của hình nền xuyên qua kính
        vibrancy_darkness = 0.5
        popups = true       # Làm mờ cả menu chuột phải và popup
    }
}
